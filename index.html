<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looking Back | Zion Taylor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body id="top">
  <nav>
    <span class="nav-title">Zion Taylor</span>
    <div class="nav-links">
      <a href="#high-school-soccer">Soccer</a>
      <a href="#bakery">Bakery</a>
      <a href="#one-armed-robber">One-Armed Robber</a>
      <a href="#canadas-wonderland">Wonderland</a>
      <a href="#roblox-game">Roblox</a>
      <a href="#looking-back">Looking Back</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <main>
    <header class="intro">
      <h2>Looking Back</h2>
      <p>Five things I've put real time into, how I'd grade each one, and what they say about where I'm headed.</p>
    </header>

    <!-- The markdown files get loaded in here -->
    <div id="items"></div>

    <div class="back-to-top">
      <button type="button" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">Back to top</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Zion Taylor</p>
  </footer>

  <!-- marked turns markdown into HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18.1.3/lib/marked.umd.js"></script>
  <script>
    // Each section on the page: which markdown file it comes from,
    // and the id the nav links use to jump to it
    const sections = [
      { file: "items/experience_1.md", id: "high-school-soccer" },
      { file: "items/experience_2.md", id: "bakery" },
      { file: "items/experience_3.md", id: "one-armed-robber" },
      { file: "items/experience_4.md", id: "canadas-wonderland" },
      { file: "items/experience_5.md", id: "roblox-game" },
      { file: "about.md", id: "looking-back" },
      { file: "contact.md", id: "contact" }
    ];

    function showError(container, message) {
      const error = document.createElement("p");
      error.className = "error";
      error.textContent = message;
      container.appendChild(error);
    }

    async function loadSections() {
      const container = document.getElementById("items");

      // Stop here with a clear message if the markdown library didn't load
      if (typeof marked === "undefined") {
        showError(container, "The markdown library didn't load. Check your internet connection and refresh the page.");
        return;
      }

      for (const section of sections) {
        try {
          const response = await fetch(section.file);
          if (!response.ok) {
            throw new Error("not found");
          }
          const markdown = await response.text();

          const article = document.createElement("article");
          article.className = "item";
          article.id = section.id;
          article.innerHTML = marked.parse(markdown);
          container.appendChild(article);
        } catch (error) {
          showError(container, "Couldn't load " + section.file + ". Check that the file exists and the name is spelled the same way.");
        }
      }

      // If the page was opened with a link like #bakery, jump there once everything has loaded
      if (window.location.hash) {
        const target = document.querySelector(window.location.hash);
        if (target) {
          target.scrollIntoView();
        }
      }
    }

    loadSections();
  </script>
</body>

</html>
