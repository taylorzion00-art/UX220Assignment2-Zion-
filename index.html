<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looking Back | Zion Taylor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body id="top">
  <nav>
    <span class="nav-title">Zion Taylor</span>
    <div class="nav-links">
      <a href="#high-school-soccer">Soccer</a>
      <a href="#bakery">Bakery</a>
      <a href="#one-armed-robber">One-Armed Robber</a>
      <a href="#canadas-wonderland">Wonderland</a>
      <a href="#roblox-game">Roblox</a>
      <a href="#looking-back">Looking Back</a>
    </div>
  </nav>

  <main>
    <header class="intro">
      <h2>Looking Back</h2>
      <p>Five things I've put real time into, how I'd grade each one, and what they say about where I'm headed.</p>
    </header>

    <!-- The markdown files from the items folder get loaded in here -->
    <div id="items"></div>

    <div class="back-to-top">
      <button type="button" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">Back to top</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Zion Taylor</p>
  </footer>

  <!-- marked turns markdown into HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18.1.3/lib/marked.umd.js"></script>
  <script>
    // List every markdown file in the items folder, in the order they should show up
    const items = [
      "01-high-school-soccer.md",
      "02-bakery.md",
      "03-one-armed-robber.md",
      "04-canadas-wonderland.md",
      "05-roblox-game.md",
      "06-looking-back.md"
    ];

    async function loadItems() {
      const container = document.getElementById("items");

      for (const file of items) {
        try {
          const response = await fetch("items/" + file);
          if (!response.ok) throw new Error(file + " not found");
          const markdown = await response.text();

          const article = document.createElement("article");
          article.className = "item";
          // "01-high-school-soccer.md" becomes "high-school-soccer" so the nav links can jump to it
          article.id = file.replace(/^\d+-/, "").replace(".md", "");
          article.innerHTML = marked.parse(markdown);
          container.appendChild(article);
        } catch (error) {
          container.innerHTML +=
            "<p class='error'>Couldn't load " + file + ". Open the page through a server instead of double-clicking the file.</p>";
        }
      }
    }

    loadItems();
  </script>
</body>

</html>
